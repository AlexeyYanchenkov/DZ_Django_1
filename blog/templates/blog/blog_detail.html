{% extends 'base.html' %}

{% block title %}{{ object.title }}{% endblock %}

{% block content %}
    <h2>{{ object.title }}</h2>
    <p>{{ object.content }}</p>
    <p><strong>Просмотров:</strong> {{ object.views_count }}</p>
    <a href="{% url 'blog:blog_update' object.pk %}" class="btn btn-warning">Редактировать</a>
    <a href="{% url 'blog:blog_delete' object.pk %}" class="btn btn-danger">Удалить</a>
    <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Назад к списку</a>
{% endblock %}
