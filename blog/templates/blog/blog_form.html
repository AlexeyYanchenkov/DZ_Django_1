{% extends 'base.html' %}

{% block title %}{{ view.object|default:"Создание статьи" }}{% endblock %}

{% block content %}
    <h2>{% if view.object %}Редактировать статью{% else %}Создать статью{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Сохранить</button>
    </form>
{% endblock %}
