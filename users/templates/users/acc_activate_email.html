<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Активация аккаунта</title>
</head>
<body>
    <h2>Здравствуйте, {{ user.username }}!</h2>

    <p>Спасибо за регистрацию на нашем сайте.</p>

    <p>Пожалуйста, перейдите по ссылке ниже, чтобы активировать ваш аккаунт:</p>

    <p>
        <a href="http://{{ domain }}{% url 'activate' uidb64=uid token=token %}">
            Активировать аккаунт
        </a>
    </p>

    <p>Если вы не регистрировались, просто проигнорируйте это письмо.</p>

    <p>С уважением,
Команда поддержки</p>
</body>
</html>
