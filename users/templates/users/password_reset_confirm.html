{% extends "base.html" %}

{% block content %}
  <h2>Новый пароль</h2>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success">Сменить пароль</button>
    </form>
  {% else %}
    <p>Ссылка для сброса пароля недействительна. Возможно, она уже использована или устарела.</p>
  {% endif %}
{% endblock %}
